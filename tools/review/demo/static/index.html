<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tip splitter</title>
</head>
<body>
  <h1>Tip splitter</h1>
  <form id="split">
    <label>Bill <input name="amount" type="number" step="0.01" min="0" required></label>
    <label>Tip % <input name="tip" type="number" step="1" min="0" value="15" required></label>
    <label>People <input name="people" type="number" step="1" min="1" value="2" required></label>
    <button>Split</button>
  </form>
  <p id="result" aria-live="polite"></p>
  <script>
    document.getElementById("split").addEventListener("submit", async (event) => {
      event.preventDefault();
      const query = new URLSearchParams(new FormData(event.target));
      const reply = await (await fetch(`/api/split?${query}`)).json();
      document.getElementById("result").textContent =
        reply.error ?? `Each person pays ${reply.share}`;
    });
  </script>
</body>
</html>
