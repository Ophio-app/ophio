[package]
name = "media"
description = "Tile-delta capture encoder and stream flow control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
turbojpeg = ["dep:turbojpeg"]

[dependencies]
protocol.workspace = true
ports.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait = "0.1.89"
bytes = "1.11"
fast_image_resize = "5.3"
jpeg-encoder = { version = "0.6.1", features = ["simd"] }
png = "0.18"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }

[target.'cfg(target_os = "linux")'.dependencies]
turbojpeg = { version = "1.4", optional = true, default-features = false, features = ["pkg-config"] }

[dev-dependencies]
jpeg-decoder = "0.3.2"
tokio = { version = "1.53", features = ["test-util"] }

[lints]
workspace = true
