[package]
name = "browser"
description = "Dedicated Chromium browser controlled through private CDP pipes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
protocol.workspace = true
voice-control = { path = "../voice-control" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
ports = { path = "../ports" }
base64 = "0.22.1"
png = "0.18"
url = "2.5.7"
tempfile = "3.20"

[target.'cfg(windows)'.dependencies]
platform-windows = { path = "../platform-windows" }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[lints]
workspace = true
