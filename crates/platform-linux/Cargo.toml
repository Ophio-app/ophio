[package]
name = "platform-linux"
description = "Linux desktop backends: wlroots/Hyprland, desktop portal and X11"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
protocol.workspace = true
ports.workspace = true
voice-control = { path = "../voice-control" }
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
serde_json = "1.0.151"

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
xkbcommon = "0.9"
wayland-client = "0.31.11"
wayland-protocols = { version = "0.32.9", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.9", features = ["client"] }
wayland-protocols-misc = { version = "0.3.9", features = ["client"] }
x11rb = { version = "0.13.2", features = ["randr", "xtest", "xfixes", "shm"] }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "screencast", "clipboard"] }
pipewire = "0.9.2"
futures-util = "0.3.34"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
tempfile = "3.20"
rustix = { version = "1.0", features = ["event", "fs", "param", "process"] }
libloading = "0.8"
libc = "0.2"
zeroize = "1.9"

[dev-dependencies]
wayland-server = "0.31.10"
wayland-protocols-wlr = { version = "0.3.9", features = ["server"] }
wayland-protocols-misc = { version = "0.3.9", features = ["server"] }
tokio = { version = "1.53", features = ["test-util"] }
wayland-protocols = { version = "0.32.9", features = ["server", "staging", "unstable"] }
xkbcommon = "0.9"
