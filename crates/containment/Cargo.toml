[package]
name = "containment"
description = "One container per agent run, so Stop and the end of a run end every process it started"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Lets tests of what drives a run make containers whose end is unconfirmed.
test-hooks = []

[dependencies]
ports.workspace = true
tokio.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.2", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["test-util"] }
tempfile = "3.23.0"
protocol.workspace = true
test-support = { path = "../test-support" }
