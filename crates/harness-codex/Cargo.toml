[package]
name = "harness-codex"
description = "Codex adapter over the app-server JSON-RPC interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
protocol.workspace = true
ports.workspace = true
containment.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

base64 = "0.22.1"
tempfile = "3.23.0"
toml = "0.9"

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.2", features = ["process"] }

[dev-dependencies]
containment = { workspace = true, features = ["test-hooks"] }
tokio = { version = "1.53", features = ["test-util"] }
test-support = { path = "../test-support" }
