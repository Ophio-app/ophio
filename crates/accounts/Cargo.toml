[package]
name = "accounts"
description = "The computer's accounts: sign-in, keys in the OS keyring, status checks and what each task receives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
protocol.workspace = true
ports.workspace = true
containment.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
base64 = "0.22.1"
getrandom = "0.3.4"
portable-pty = "0.9.0"
ring = "0.17"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10.9"
shell-words = "1.1.1"
url = "2.5.7"
zeroize = { version = "1.9", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process", "fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
platform-windows = { path = "../platform-windows" }

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.53.1", features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
futures-util = "0.3.34"
zbus = { version = "5.19", default-features = false, features = ["tokio", "p2p"] }

[lints]
workspace = true
