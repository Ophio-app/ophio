[package]
name = "platform-windows"
description = "Windows session desktop, owner storage, local pipe and startup adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
protocol.workspace = true
ports.workspace = true
voice-control = { path = "../voice-control" }
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zeroize = "1.8.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11",
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Security_Cryptography", "Win32_Storage_FileSystem",
    "Win32_System_Com", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_Pipes",
    "Win32_System_Registry", "Win32_System_Threading", "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_RemoteDesktop", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
    "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
    "Win32_System_StationsAndDesktops", "Win32_System_IO", "Win32_System_Shutdown",
    "Wdk_Storage_FileSystem",
] }

[lints]
workspace = true
