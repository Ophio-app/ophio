[package]
name = "terminal"
description = "Host terminal sessions over PTY/ConPTY with offset-addressed scrollback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
protocol.workspace = true
ports.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
bytes = "1.11"
portable-pty = "0.9.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29.0", features = ["fs", "signal", "user"] }

[target.'cfg(target_os = "linux")'.dependencies]
containment.workspace = true
libc = "0.2"

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
tempfile = "3.23.0"
