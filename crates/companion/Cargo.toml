[package]
name = "companion"
description = "Øphio on the computer: its service and command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ophio"
path = "src/main.rs"

[dependencies]
jev = { path = "../jev" }
voice-control = { path = "../voice-control" }
browser = { path = "../browser" }
speech = { path = "../speech" }
channels = { path = "../channels" }
rpassword = "7.4.0"
harness-claude = { path = "../harness-claude" }
harness-codex = { path = "../harness-codex" }
computer-mcp = { path = "../computer-mcp" }
library = { path = "../library" }
terminal = { path = "../terminal" }
media = { path = "../media" }
store = { path = "../store" }
protocol.workspace = true
services.workspace = true
accounts.workspace = true
ports.workspace = true
sandbox.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
bytes.workspace = true
async-trait.workspace = true
axum = { version = "0.8", features = ["ws", "json"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
ed25519-dalek = "2.2"
flate2 = "1.1"
futures-util = { version = "0.3", features = ["sink"] }
hostname = "0.4"
hyper = { version = "1.6", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
crossterm = "0.29"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"
socket2 = "0.6"
tar = { version = "0.4", default-features = false }
tempfile = "3.20"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
unicode-width = "0.2"
toml = "0.9"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["json"] }
zeroize = { version = "1.9", features = ["derive"] }
time = { version = "0.3.55", features = ["parsing", "local-offset"] }

[target.'cfg(target_os = "linux")'.dependencies]
platform-linux = { path = "../platform-linux" }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.0", features = ["process", "fs", "param"] }

[target.'cfg(windows)'.dependencies]
platform-windows = { path = "../platform-windows" }

[dev-dependencies]
containment.workspace = true
test-support = { path = "../test-support" }
tokio = { workspace = true, features = ["test-util"] }
services = { workspace = true, features = ["testing"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { version = "0.29.0", features = ["signal"] }

[lints]
workspace = true
