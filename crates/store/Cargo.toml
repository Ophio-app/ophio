[package]
name = "store"
description = "SQLite persistence: journal, projections, command dedupe, devices and artifacts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
protocol.workspace = true
domain.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
globset = "0.4"
sha2 = "0.10.9"
cap-std = "4.0.3"

rusqlite = { version = "0.41.0", features = ["bundled", "backup"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.23.0"

[features]
# SQL tracing for downstream performance regression tests.
testing = ["rusqlite/trace"]
