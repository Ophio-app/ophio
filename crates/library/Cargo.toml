[package]
name = "library"
description = "Markdown Library roots on the host filesystem: listing, revisioned saves, trash, search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
protocol.workspace = true
ports.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
same-file = "1.0.6"
ignore = "0.4.25"
notify = "8.2.0"
uuid = { version = "1.26", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security",
    "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO",
] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
