# SPDX-License-Identifier: Apache-2.0
[package]
name = "tauri-plugin-device"
version = "0.1.0"
description = "Private Android device integration for the app"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
publish = false
links = "tauri-plugin-device"

[dependencies]
tauri = "=2.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.21"

[build-dependencies]
tauri-plugin = { version = "=2.7.0", features = ["build"] }

[lints]
workspace = true
