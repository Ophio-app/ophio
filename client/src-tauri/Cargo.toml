# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "3"
members = [".", "plugins/device", "tools/dev-host"]
default-members = [".", "plugins/device"]

[workspace.lints.rust]
unsafe_code = "deny"

[package]
name = "phone-shell"
version = "0.1.0"
description = "Android client native shell"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
publish = false

[lib]
name = "phone_shell"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
protocol = { path = "../../crates/protocol" }
ports = { path = "../../crates/ports" }
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-device = { path = "plugins/device" }
tauri-plugin-opener = "=2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.21"
async-trait = "0.1.89"
base64 = "0.22.1"
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3.32", features = ["sink"] }
ed25519-dalek = { version = "2.2.0", features = ["zeroize"] }
zeroize = { version = "1.9.0", features = ["derive"] }
url = "2.5.7"
hyper = { version = "1.8.1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.3"
bytes = "1.11.1"
tracing = "0.1.44"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
libc = "0.2.189"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
tempfile = "3.26.0"
tokio = { version = "1.53.0", features = ["test-util"] }

[lints]
workspace = true
