[package]
name = "dev-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
publish = false

[dependencies]
companion = { path = "../../../../crates/companion" }
services = { path = "../../../../crates/services", features = ["testing"] }
ports = { path = "../../../../crates/ports" }
protocol = { path = "../../../../crates/protocol" }
store = { path = "../../../../crates/store" }
media = { path = "../../../../crates/media" }
tokio = { version = "1.53.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
serde_json = "1.0.149"
base64 = "0.22.1"

[lints]
workspace = true

[dependencies.async-trait]
version = "0.1.89"

[dev-dependencies]
phone-shell = { path = "../.." }
async-trait = "0.1.89"
ed25519-dalek = "2.2.0"
futures-util = "0.3.32"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
zeroize = "1.9.0"
tempfile = "3.26.0"
serde = "1.0.229"
