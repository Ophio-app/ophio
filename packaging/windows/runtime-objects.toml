# SPDX-License-Identifier: Apache-2.0
# MinGW-w64 runtime objects the Windows executables are allowed to link, each
# reviewed against its source and the files it includes. Packaging reads the
# linker maps and fails on any other runtime object, so a new dependency cannot
# pull in unreviewed runtime code (such as the Cephes-derived maths the
# runtime's notice leaves unresolved) without a review here first.
#
# Names are as the linker map prints them: the startup objects by file name,
# archive members as "lib64_<archive>_a-<source>.o".
#
# Headers: the C code compiled for Windows (SQLite and ring) includes no
# LGPL-licensed header. The one Wine-derived header it reaches,
# corecrt_stdio_config.h, is in the public domain.

source = "https://github.com/mingw-w64/mingw-w64/tree/4564ee4b5063097bf747af3a3f8270a28adff820/mingw-w64-crt"
toolchain = "llvm-mingw with mingw-w64 15.0.0 headers and runtime"

[licenses]
"LicenseRef-MinGW-public-domain" = "No copyright assigned and placed in the public domain (DISCLAIMER.PD), or offered for use without restriction of copyright."
"ZPL-2.1" = "The runtime's overall licence, for files that carry no notice of their own."
"LicenseRef-gdtoa-Lucent" = "David M. Gay's gdtoa, under the Lucent Technologies permission notice reproduced in the runtime notice."

[objects]
"crt2.o" = { source = "crt/crtexe.c", licenses = ["LicenseRef-MinGW-public-domain"] }
"crtbegin.o" = { source = "crt/crtbegin.c", licenses = ["LicenseRef-MinGW-public-domain"] }
"crtend.o" = { source = "crt/crtend.c", licenses = ["LicenseRef-MinGW-public-domain"] }
"lib64_libmingw32_a-cinitexe.o" = { source = "crt/cinitexe.c", licenses = ["ZPL-2.1"] }
