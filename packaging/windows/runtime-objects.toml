"lib64_libmingw32_a-gccmain.o" = { source = "crt/gccmain.c", licenses = ["LicenseRef-MinGW-public-domain"] }
"lib64_libmingw32_a-merr.o" = { source = "crt/merr.c", licenses = ["LicenseRef-MinGW-public-domain"] }
"lib64_libmingw32_a-mingw_helpers.o" = { source = "crt/mingw_helpers.c", licenses = ["LicenseRef-MinGW-public-domain"] }
